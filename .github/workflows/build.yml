name: Build and publish

on:
  schedule:
    # UTC. 11:15 is 7:15am Eastern in summer, 6:15am in winter -- GitHub cron
    # has no timezone, so the second run keeps the page fresh either way.
    - cron: "15 11 * * *"
    - cron: "15 22 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed to commit the games-back history back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Build the eight-day app
        run: python site.py --days 15

      - name: Commit the games-back history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/history
          if git diff --cached --quiet; then
            echo "no new history row today"
          else
            # [skip ci] matters: without it this push retriggers the workflow,
            # which commits again, forever.
            git commit -m "History: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
