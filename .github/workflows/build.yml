name: Build and publish

on:
  schedule:
    # Every hour, at :41. GitHub has been firing this account's scheduled runs
    # hours late, and by an amount that keeps moving: 4-5 hours in October,
    # 8 to 10.5 hours by late November (05:13 UTC landing at 15:07), which put
    # the first build of the day near 10am Eastern. Any fixed set of slots is
    # tuned to one delay and breaks at the next. With one every hour, whatever
    # the delay is, some run lands in the early morning; the gate below builds
    # on the first that lands after 5am Eastern and skips the rest, so it is
    # still one build a day. A gate-only run is a few seconds.
    # Not :00 -- the most contended minute on Actions and the one most often
    # dropped.
    - cron: "41 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed to commit the games-back history back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          today=$(TZ=America/New_York date +%F)
          built=$(cat output/history/_last_build.txt 2>/dev/null || echo none)

          # The schedule fires every hour (see above), so the gate is what
          # makes it once a day: the first run to land between 5am and noon
          # Eastern builds, and every later one sees today in _last_build.txt
          # and skips. 5am rather than 6 so that a run landing just before the
          # hour still counts -- the page is wanted BY six. 10# forces base
          # ten: 08 and 09 are not valid octal and would abort the arithmetic.
          h=$(( 10#$hour ))
          if [ "${{ github.event_name }}" != "schedule" ]; then
            reason="manual or push"; go=yes
          elif [ "$h" -ge 5 ] && [ "$h" -le 12 ] && [ "$built" != "$today" ]; then
            reason="first run after 5am Eastern: nothing built for $today yet"; go=yes
          elif [ "$built" = "$today" ]; then
            reason="already built for $today"; go=no
          else
            reason="Eastern hour $hour, last build $built"; go=no
          fi

          if [ "$go" = "yes" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "building ($reason)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "skipping ($reason)"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Build the app
        run: python site.py --days 15

      - name: Commit the games-back history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/history
          if git diff --cached --quiet; then
            echo "no new history row today"
          else
            # [skip ci] matters: without it this push retriggers the workflow,
            # which commits again, forever.
            git commit -m "History: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
