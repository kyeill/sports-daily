name: Build and publish

on:
  schedule:
    # GitHub cron is UTC only, so 6am Eastern is 10:00 UTC in summer and 11:00
    # in winter. Both fire; the gate below lets exactly one of them through,
    # so this really is once a day at 6am Eastern all year.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed to commit the games-back history back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "building (Eastern hour is $hour)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipping: Eastern hour is $hour, not 06"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Build the app
        run: python site.py --days 15

      - name: Commit the games-back history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/history
          if git diff --cached --quiet; then
            echo "no new history row today"
          else
            # [skip ci] matters: without it this push retriggers the workflow,
            # which commits again, forever.
            git commit -m "History: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
